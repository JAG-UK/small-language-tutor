<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Tutor</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Main Chat Area -->
        <div class="chat-panel">
            <div class="chat-header">
                <h2>Practice Conversation</h2>
                <select id="language-select">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                </select>
                <select id="tone-select">
                    <option value="friendly">Friendly</option>
                    <option value="professional">Professional</option>
                    <option value="flirty">Flirty</option>
                </select>
                <button onclick="toggleConversations()" class="save-btn">Conversations</button>
                <button onclick="toggleReport()" class="report-btn">Report card</button>
                <button onclick="startNewConversation()" class="new-conversation-btn">New Conversation</button>
            </div>
            
            <div id="conversation-list" class="conversation-list" hidden></div>
            <div id="report-card" class="report-card" hidden></div>

            <div id="chat-messages" class="chat-messages">
                <div class="welcome-message">
                    <p>Start a conversation in your target language! I'll help you practice.</p>
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" 
                       id="chat-input" 
                       placeholder="Type your message..."
                       name="message">
                <button id="send-button" onclick="sendMessage()">
                    <span id="send-text">Send</span>
                    <span id="send-spinner" class="spinner" style="display: none;"></span>
                </button>
            </div>
        </div>
        
        <!-- Corrections Panel -->
        <div class="corrections-panel">
            <h3>Learning Points and Hints</h3>
            <div id="review-pending" class="review-pending" hidden>
                <span class="spinner-inline"></span>Looking over what you wrote…
            </div>
            <div id="corrections-list">
                <p class="empty-state">No learning points yet. Keep practicing!</p>
            </div>
        </div>
        
        <!-- Practice Panel -->
        <div class="practice-panel">
            <h3>Practice Area</h3>
            
            <!-- Top Section: Grammar Check -->
            <div class="practice-section">
                <p class="hint">Test sentences here before sending</p>
                <textarea id="practice-input" 
                          placeholder="Type a sentence to check..."
                          rows="3"></textarea>
                <button onclick="checkPractice()">Check</button>
                <div id="practice-result"></div>
            </div>
            
            <!-- Bottom Section: Translation -->
            <div class="practice-section practice-section-bottom">
                <p class="hint">Translation</p>
                <select id="translation-direction" onchange="updateTranslationPlaceholder()">
                    <option value="en-to-target">English → Target Language</option>
                    <option value="target-to-en">Target Language → English</option>
                </select>
                <textarea id="translation-input" 
                          placeholder="Enter an English phrase..."
                          rows="3"></textarea>
                <button onclick="translatePhrase()">Translate</button>
                <div id="translation-result"></div>
            </div>
        </div>
    </div>
    
    <script>
        // A fresh id per page load. The server keys its in-memory copy by this;
        // which conversation that copy holds is remembered separately, below.
        let sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

        // Which conversation this browser was last in. Without it a refresh
        // leaves you staring at an empty page, with the conversation saved but
        // nowhere in sight. Wrapped because storage throws in private windows,
        // where losing your place is a nuisance rather than losing the work.
        const RESUME_KEY = 'slt.conversation';

        function rememberConversation(id) {
            try {
                if (id === null || id === undefined) localStorage.removeItem(RESUME_KEY);
                else localStorage.setItem(RESUME_KEY, String(id));
            } catch (error) { /* the conversation is still saved on the server */ }
        }

        function rememberedConversation() {
            try {
                const stored = localStorage.getItem(RESUME_KEY);
                return stored ? Number(stored) : null;
            } catch (error) {
                return null;
            }
        }
        
        // Function to start a new conversation
        function startNewConversation() {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            rememberConversation(null);
            // Clear the chat messages
            document.getElementById('chat-messages').innerHTML = '<div class="welcome-message"><p>Start a conversation in your target language! I\'ll help you practice.</p></div>';
            // Clear corrections/hints
            document.getElementById('corrections-list').innerHTML = '<p class="empty-state">No learning points yet. Keep practicing!</p>';
        }
        
        // Load initial corrections and hints on page load
        function loadInitialLearningPoints() {
            fetch(`/api/corrections?session_id=${sessionId}`)
                .then(r => r.text())
                .then(html => {
                    document.getElementById('corrections-list').innerHTML = html;
                })
                .catch(err => {
                    console.error('Error loading learning points:', err);
                });
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            const resume = rememberedConversation();
            if (resume) {
                openConversation(resume);
            } else {
                loadInitialLearningPoints();
            }
            
            // Allow Enter to send
            document.getElementById('chat-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Update translation placeholder when language changes
            document.getElementById('language-select').addEventListener('change', function() {
                updateTranslationPlaceholder();
            });
        });
        
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const language = document.getElementById('language-select').value;
            const tone = document.getElementById('tone-select').value;
            const message = input.value.trim();
            const sendButton = document.getElementById('send-button');
            const sendText = document.getElementById('send-text');
            const sendSpinner = document.getElementById('send-spinner');
            
            if (!message) return;

            // On screen first, before anything is asked of the model. What the
            // learner typed is not in doubt, and waiting to show it made the
            // whole turn arrive at once after a long silence.
            addMessage('user', message);
            input.value = '';
            const pending = addPendingReply();

            // Disable button and show spinner
            sendButton.disabled = true;
            sendText.style.display = 'none';
            sendSpinner.style.display = 'inline-block';
            input.disabled = true;

            fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    session_id: sessionId,
                    message: message,
                    language: language,
                    tone: tone
                })
            })
            .then(r => r.json())
            .then(data => {
                // The spinner bubble becomes the reply, in the place it has
                // been sitting. There used to be a deliberate half-second pause
                // before this; the wait is now visible while it happens, and
                // padding it further only makes the reply late.
                pending.remove();
                addMessage('assistant', data.response);

                // Now there is a conversation to come back to on a refresh.
                rememberConversation(data.conversation_id);

                // The critique of that message is a second request, made now
                // that the reply is on screen. It fills the panel in behind,
                // and the input is already usable again by then.
                reviewTurn(data.turn);
            })
            .catch(error => {
                console.error('Error:', error);
                pending.remove();
                addMessage('assistant', 'Sorry, there was an error. Please try again.');
            })
            .finally(() => {
                // Re-enable button and hide spinner
                sendButton.disabled = false;
                sendText.style.display = 'inline';
                sendSpinner.style.display = 'none';
                input.disabled = false;
                input.focus();
            });
        }
        
        // Ask what was wrong with the turn just sent. Failing quietly is the
        // right behaviour here: no learning points is a worse conversation,
        // not a broken one.
        function reviewTurn(turn) {
            if (typeof turn !== 'number') return;
            const pending = document.getElementById('review-pending');
            pending.hidden = false;
            
            fetch('/api/review', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId, turn: turn})
            })
            .then(r => r.ok ? r.text() : null)
            .then(html => {
                if (html !== null) {
                    document.getElementById('corrections-list').innerHTML = html;
                }
            })
            .catch(error => console.error('Review failed:', error))
            .finally(() => { pending.hidden = true; });
        }
        
        // --- saved conversations ------------------------------------------
        // Every turn is written through as it happens, so this list is simply
        // the history; there is nothing to press to keep a conversation.

        // What the recent mistakes add up to. One model call over the lot, so
        // it takes a while — hence the spinner rather than a blank panel.
        function toggleReport() {
            const panel = document.getElementById('report-card');
            if (!panel.hidden) { panel.hidden = true; return; }

            document.getElementById('conversation-list').hidden = true;
            panel.innerHTML = '<div class="practice-loading">' +
                '<span class="spinner-inline"></span>Looking over your mistakes…</div>';
            panel.hidden = false;

            fetch('/api/report')
                .then(r => r.text())
                .then(html => { panel.innerHTML = html; })
                .catch(error => {
                    console.error('Could not build the report:', error);
                    panel.innerHTML =
                        '<p class="empty-state">Could not look over those just now.</p>';
                });
        }

        function toggleConversations() {
            const panel = document.getElementById('conversation-list');
            if (!panel.hidden) { panel.hidden = true; return; }
            document.getElementById('report-card').hidden = true;
            fetch('/api/conversations')
                .then(r => r.text())
                .then(html => { panel.innerHTML = html; panel.hidden = false; })
                .catch(error => console.error('Could not list conversations:', error));
        }

        function openConversation(id) {
            fetch(`/api/conversations/${id}/open`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId})
            })
            .then(r => r.ok ? r.json() : Promise.reject(r.status))
            .then(data => {
                rememberConversation(data.id);
                document.getElementById('language-select').value = data.language;
                document.getElementById('tone-select').value = data.tone;
                const messages = document.getElementById('chat-messages');
                messages.innerHTML = '';
                data.messages.forEach(m => addMessage(m.role, m.content));
                document.getElementById('corrections-list').innerHTML = data.panel;
                document.getElementById('conversation-list').hidden = true;
                updateTranslationPlaceholder();
            })
            .catch(error => {
                // Most likely it has been deleted since. Forget it and start
                // clean rather than trying to resume it again on every load.
                rememberConversation(null);
                if (error !== 404) console.error('Could not open conversation:', error);
            });
        }

        function deleteConversation(id) {
            fetch(`/api/conversations/${id}`, {method: 'DELETE'})
                .then(() => {
                    const row = document.querySelector(`.conversation-item[data-id="${id}"]`);
                    if (row) row.remove();
                    // If it was the one on screen, stop showing it and stop
                    // trying to resume it.
                    if (rememberedConversation() === id) startNewConversation();
                })
                .catch(error => console.error('Could not delete conversation:', error));
        }

        // Where the reply will go, spinning until there is one to put there.
        function addPendingReply() {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant pending-reply';
            msgDiv.innerHTML =
                '<div class="message-content"><span class="spinner-inline"></span></div>';
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return msgDiv;
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function checkPractice() {
            const textarea = document.getElementById('practice-input');
            const language = document.getElementById('language-select').value;
            const sentence = textarea.value.trim();
            
            if (!sentence) return;

            // Checking is a model call the learner is waiting on, and the
            // critic is deliberately the careful model rather than the quick
            // one, so say something is happening.
            const resultDiv = document.getElementById('practice-result');
            resultDiv.innerHTML =
                '<div class="practice-loading"><span class="spinner-inline"></span>Checking…</div>';

            fetch('/api/practice', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sentence, language})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    resultDiv.innerHTML =
                        `<div class="practice-error">${escapeHtml(data.error)}</div>`;
                } else if (data.has_errors) {
                    resultDiv.innerHTML = `
                        <div class="practice-error">
                            <strong>Correction:</strong> ${escapeHtml(data.corrected)}<br>
                            <em>${escapeHtml(data.explanation)}</em>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="practice-success">
                            ✓ Looks good! Ready to send.
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Could not check that sentence:', error);
                resultDiv.innerHTML =
                    '<div class="practice-error">Could not check that. Try again.</div>';
            });
        }
        
        function updateTranslationPlaceholder() {
            const direction = document.getElementById('translation-direction').value;
            const textarea = document.getElementById('translation-input');
            const language = document.getElementById('language-select').value;
            const languageNames = {
                'es': 'Spanish',
                'fr': 'French',
                'de': 'German',
                'it': 'Italian'
            };
            const langName = languageNames[language] || 'Target Language';
            
            if (direction === 'en-to-target') {
                textarea.placeholder = 'Enter an English phrase...';
            } else {
                textarea.placeholder = `Enter a ${langName} phrase...`;
            }
        }
        
        function translatePhrase() {
            const textarea = document.getElementById('translation-input');
            const language = document.getElementById('language-select').value;
            const direction = document.getElementById('translation-direction').value;
            const phrase = textarea.value.trim();
            
            if (!phrase) return;
            
            const resultDiv = document.getElementById('translation-result');
            resultDiv.innerHTML =
                '<div class="practice-loading"><span class="spinner-inline"></span>Translating…</div>';
            
            fetch('/api/translate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phrase: phrase,
                    language: language,
                    direction: direction
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    resultDiv.innerHTML = `
                        <div class="practice-error">
                            ${escapeHtml(data.error)}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="translation-result">
                            <div class="translation-label">Translation:</div>
                            <div class="translation-text">${escapeHtml(data.translation)}</div>
                        </div>
                    `;
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `
                    <div class="practice-error">
                        Error: Could not translate. Please try again.
                    </div>
                `;
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
