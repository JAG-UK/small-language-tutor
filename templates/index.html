<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Tutor</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Main Chat Area -->
        <div class="chat-panel">
            <div class="chat-header">
                <h2>Practice Conversation</h2>
                <select id="language-select">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                </select>
                <select id="tone-select">
                    <option value="friendly">Friendly</option>
                    <option value="professional">Professional</option>
                    <option value="flirty">Flirty</option>
                </select>
                <button id="save-btn" 
                        hx-post="/api/save" 
                        hx-headers='{"Content-Type": "application/json"}'
                        hx-target="#save-status"
                        class="save-btn">Save Conversation</button>
                <button onclick="startNewConversation()" class="new-conversation-btn">New Conversation</button>
                <span id="save-status"></span>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <div class="welcome-message">
                    <p>Start a conversation in your target language! I'll help you practice.</p>
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" 
                       id="chat-input" 
                       placeholder="Type your message..."
                       name="message">
                <button id="send-button" onclick="sendMessage()">
                    <span id="send-text">Send</span>
                    <span id="send-spinner" class="spinner" style="display: none;"></span>
                </button>
            </div>
        </div>
        
        <!-- Corrections Panel -->
        <div class="corrections-panel">
            <h3>Learning Points and Hints</h3>
            <div id="review-pending" class="review-pending" hidden>Looking over what you wrote…</div>
            <div id="corrections-list">
                <p class="empty-state">No learning points yet. Keep practicing!</p>
            </div>
        </div>
        
        <!-- Practice Panel -->
        <div class="practice-panel">
            <h3>Practice Area</h3>
            
            <!-- Top Section: Grammar Check -->
            <div class="practice-section">
                <p class="hint">Test sentences here before sending</p>
                <textarea id="practice-input" 
                          placeholder="Type a sentence to check..."
                          rows="3"></textarea>
                <button onclick="checkPractice()">Check</button>
                <div id="practice-result"></div>
            </div>
            
            <!-- Bottom Section: Translation -->
            <div class="practice-section practice-section-bottom">
                <p class="hint">Translation</p>
                <select id="translation-direction" onchange="updateTranslationPlaceholder()">
                    <option value="en-to-target">English → Target Language</option>
                    <option value="target-to-en">Target Language → English</option>
                </select>
                <textarea id="translation-input" 
                          placeholder="Enter an English phrase..."
                          rows="3"></textarea>
                <button onclick="translatePhrase()">Translate</button>
                <div id="translation-result"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Generate a unique session ID on page load
        let sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        
        // Function to start a new conversation
        function startNewConversation() {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            // Clear the chat messages
            document.getElementById('chat-messages').innerHTML = '<div class="welcome-message"><p>Start a conversation in your target language! I\'ll help you practice.</p></div>';
            // Clear corrections/hints
            document.getElementById('corrections-list').innerHTML = '<p class="empty-state">No learning points yet. Keep practicing!</p>';
            // Update HTMX attributes with new session ID
            updateSessionInHTMX();
        }
        
        // Update HTMX attributes with current session ID (for save button)
        function updateSessionInHTMX() {
            const sessionData = JSON.stringify({session_id: sessionId});
            
            // Update save button
            const saveBtn = document.getElementById('save-btn');
            if (saveBtn) {
                saveBtn.setAttribute('hx-vals', sessionData);
            }
        }
        
        // Load initial corrections and hints on page load
        function loadInitialLearningPoints() {
            fetch(`/api/corrections?session_id=${sessionId}`)
                .then(r => r.text())
                .then(html => {
                    document.getElementById('corrections-list').innerHTML = html;
                })
                .catch(err => {
                    console.error('Error loading learning points:', err);
                });
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateSessionInHTMX();
            loadInitialLearningPoints();
            
            // Allow Enter to send
            document.getElementById('chat-input').addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // Update translation placeholder when language changes
            document.getElementById('language-select').addEventListener('change', function() {
                updateTranslationPlaceholder();
            });
        });
        
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const language = document.getElementById('language-select').value;
            const tone = document.getElementById('tone-select').value;
            const message = input.value.trim();
            const sendButton = document.getElementById('send-button');
            const sendText = document.getElementById('send-text');
            const sendSpinner = document.getElementById('send-spinner');
            
            if (!message) return;
            
            // Disable button and show spinner
            sendButton.disabled = true;
            sendText.style.display = 'none';
            sendSpinner.style.display = 'inline-block';
            input.disabled = true;
            
            fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    session_id: sessionId,
                    message: message,
                    language: language,
                    tone: tone
                })
            })
            .then(r => r.json())
            .then(data => {
                // Add user message
                addMessage('user', message);
                input.value = '';
                
                // Add AI response
                setTimeout(() => addMessage('assistant', data.response), 500);
                
                // The critique of that message is a second request, made now
                // that the reply is on screen. It fills the panel in behind,
                // and the input is already usable again by then.
                reviewTurn(data.turn);
            })
            .catch(error => {
                console.error('Error:', error);
                addMessage('assistant', 'Sorry, there was an error. Please try again.');
            })
            .finally(() => {
                // Re-enable button and hide spinner
                sendButton.disabled = false;
                sendText.style.display = 'inline';
                sendSpinner.style.display = 'none';
                input.disabled = false;
                input.focus();
            });
        }
        
        // Ask what was wrong with the turn just sent. Failing quietly is the
        // right behaviour here: no learning points is a worse conversation,
        // not a broken one.
        function reviewTurn(turn) {
            if (typeof turn !== 'number') return;
            const pending = document.getElementById('review-pending');
            pending.hidden = false;
            
            fetch('/api/review', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId, turn: turn})
            })
            .then(r => r.ok ? r.json() : null)
            .then(data => {
                if (data) {
                    renderLearningPoints(data.all_corrections || [], data.all_hints || []);
                }
            })
            .catch(error => console.error('Review failed:', error))
            .finally(() => { pending.hidden = true; });
        }
        
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<div class="message-content">${escapeHtml(content)}</div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function renderLearningPoints(corrections, hints) {
            const correctionsDiv = document.getElementById('corrections-list');
            
            if (corrections.length === 0 && hints.length === 0) {
                correctionsDiv.innerHTML = '<p class="empty-state">No learning points yet. Keep practicing!</p>';
                return;
            }
            
            // Combine corrections and hints, sorted by timestamp (most recent first)
            const allItems = [];
            
            corrections.forEach(corr => {
                allItems.push({
                    type: 'correction',
                    timestamp: corr.timestamp || '',
                    data: corr
                });
            });
            
            hints.forEach(hint => {
                allItems.push({
                    type: 'hint',
                    timestamp: hint.timestamp || '',
                    data: hint
                });
            });
            
            // Sort by timestamp, most recent first
            allItems.sort((a, b) => {
                if (!a.timestamp) return 1;
                if (!b.timestamp) return -1;
                return b.timestamp.localeCompare(a.timestamp);
            });
            
            // Render all items
            let html = '';
            allItems.forEach(item => {
                if (item.type === 'correction') {
                    const corr = item.data;
                    const original = escapeHtml(corr.message || '');
                    const corrected = escapeHtml(corr.corrected || '');
                    let explanation = corr.explanation || '';
                    
                    // Handle explanation as string or list
                    if (Array.isArray(explanation)) {
                        explanation = explanation.map(e => escapeHtml(String(e))).join('<br>');
                    } else {
                        explanation = escapeHtml(String(explanation));
                    }
                    
                    html += `
                        <div class="correction-item">
                            <div class="item-label">Correction</div>
                            <div class="original">${original}</div>
                            <div class="corrected">✓ ${corrected}</div>
                            <div class="explanation">${explanation}</div>
                        </div>
                    `;
                } else {
                    const hint = item.data;
                    const message = escapeHtml(hint.message || '');
                    const hintsList = hint.hints || [];
                    
                    let hintsHtml = '';
                    hintsList.forEach(hint => {
                        // Conversations saved before hints were split into a
                        // suggestion and a reason carry plain strings.
                        if (hint && typeof hint === 'object') {
                            hintsHtml += `<li>` +
                                `<span class="hint-suggestion">${escapeHtml(String(hint.suggestion || ''))}</span>` +
                                `<span class="hint-why">${escapeHtml(String(hint.why || ''))}</span>` +
                                `</li>`;
                        } else {
                            hintsHtml += `<li>${escapeHtml(String(hint))}</li>`;
                        }
                    });
                    
                    html += `
                        <div class="hint-item">
                            <div class="item-label">Hint</div>
                            <div class="hint-message">${message}</div>
                            <ul class="hints-list">${hintsHtml}</ul>
                        </div>
                    `;
                }
            });
            
            correctionsDiv.innerHTML = html;
        }
        
        function checkPractice() {
            const textarea = document.getElementById('practice-input');
            const language = document.getElementById('language-select').value;
            const sentence = textarea.value.trim();
            
            if (!sentence) return;
            
            fetch('/api/practice', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({sentence, language})
            })
            .then(r => r.json())
            .then(data => {
                const resultDiv = document.getElementById('practice-result');
                if (data.has_errors) {
                    resultDiv.innerHTML = `
                        <div class="practice-error">
                            <strong>Correction:</strong> ${escapeHtml(data.corrected)}<br>
                            <em>${escapeHtml(data.explanation)}</em>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="practice-success">
                            ✓ Looks good! Ready to send.
                        </div>
                    `;
                }
            });
        }
        
        function updateTranslationPlaceholder() {
            const direction = document.getElementById('translation-direction').value;
            const textarea = document.getElementById('translation-input');
            const language = document.getElementById('language-select').value;
            const languageNames = {
                'es': 'Spanish',
                'fr': 'French',
                'de': 'German',
                'it': 'Italian'
            };
            const langName = languageNames[language] || 'Target Language';
            
            if (direction === 'en-to-target') {
                textarea.placeholder = 'Enter an English phrase...';
            } else {
                textarea.placeholder = `Enter a ${langName} phrase...`;
            }
        }
        
        function translatePhrase() {
            const textarea = document.getElementById('translation-input');
            const language = document.getElementById('language-select').value;
            const direction = document.getElementById('translation-direction').value;
            const phrase = textarea.value.trim();
            
            if (!phrase) return;
            
            const resultDiv = document.getElementById('translation-result');
            resultDiv.innerHTML = '<div class="practice-loading">Translating...</div>';
            
            fetch('/api/translate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phrase: phrase,
                    language: language,
                    direction: direction
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    resultDiv.innerHTML = `
                        <div class="practice-error">
                            ${escapeHtml(data.error)}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="translation-result">
                            <div class="translation-label">Translation:</div>
                            <div class="translation-text">${escapeHtml(data.translation)}</div>
                        </div>
                    `;
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `
                    <div class="practice-error">
                        Error: Could not translate. Please try again.
                    </div>
                `;
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
